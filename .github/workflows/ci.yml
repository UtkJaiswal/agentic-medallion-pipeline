name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: medallion, POSTGRES_PASSWORD: medallion, POSTGRES_DB: medallion}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U medallion" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql://medallion:medallion@localhost:55432/medallion
