[project]
name = "medallion"
version = "1.0.0"
description = "AI-assisted medallion pipeline (bronze -> silver -> gold) for facility support tickets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.70",
    "google-genai>=1.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
medallion = "medallion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP046", "UP047"]
