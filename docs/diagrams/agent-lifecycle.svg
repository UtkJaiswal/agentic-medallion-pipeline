<text x="620.0" y="454" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Episodic memory</text>
<text x="620.0" y="474" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">what happened: human corrections</text>
<text x="620.0" y="491" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">similar ones recalled as precedents</text>
<text x="620.0" y="508" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">(41 corrections from review)</text>
<rect x="832" y="432" width="360" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
<text x="1012.0" y="454" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Procedural memory</text>
<text x="1012.0" y="474" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">how to do it: rules consolidated</text>
<text x="1012.0" y="491" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">from reviews, versioned files</text>
<text x="1012.0" y="508" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">→ injected into the system prompt</text>
