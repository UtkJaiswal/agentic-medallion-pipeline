<text x="1068.0" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Auto-approved</text>
<text x="1068.0" y="116" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">policy:auto, audited</text>
<rect x="920" y="162" width="296" height="60" rx="10" fill="#FFF1E6" stroke="#E07B24" stroke-width="1.6"/>
<text x="1068.0" y="184" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3A06" text-anchor="middle">Human review queue</text>
<text x="1068.0" y="204" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">lowest trust first · approve / correct / reject</text>
<path d="M 1068 222 L 1068 272" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1076.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">approve or correct</text>
