<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1240" height="600" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start">Agent lifecycle: propose → verify → trust → approve → learn</text>
<text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Agents never write to silver or gold. Approved proposals become reference data; reviews become memory.</text>
<rect x="24" y="90" width="220" height="116" rx="10" fill="#E7F0FF" stroke="#3B6FD8" stroke-width="1.6"/>
<text x="134.0" y="112" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Agent proposes</text>
<text x="134.0" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">classification: category,</text>
<text x="134.0" y="149" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">severity, hazard</text>
<text x="134.0" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">DQ: rule + SQL</text>
<text x="134.0" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">gold: mart SQL</text>
<path d="M 244 148 L 284 148" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="284" y="90" width="240" height="116" rx="10" fill="#FDECEC" stroke="#C24141" stroke-width="1.6"/>
<text x="404.0" y="112" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">Code verifies</text>
<text x="404.0" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">schema + taxonomy enums</text>
<text x="404.0" y="149" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">SQL guard (read-only, timeout)</text>
<text x="404.0" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">executed on real data</text>
<text x="404.0" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">repair loop ≤ 2 rounds</text>
<path d="M 524 148 L 564 148" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="564" y="90" width="300" height="116" rx="10" fill="#FFF1E6" stroke="#E07B24" stroke-width="1.6"/>
<text x="714.0" y="112" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3A06" text-anchor="middle">Trust score</text>
<text x="714.0" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">human 0.6  (similar past reviews)</text>
<text x="714.0" y="149" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">judge 0.3  (independent model)</text>
<text x="714.0" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">agent 0.1  (self-confidence)</text>
<text x="714.0" y="183" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">missing signals renormalised</text>
<path d="M 864 120 L 920 104" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 864 176 L 920 192" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="892" y="70" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">trust ≥ threshold (classification only)</text>
<text x="892" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">otherwise; DQ &amp; gold always</text>
