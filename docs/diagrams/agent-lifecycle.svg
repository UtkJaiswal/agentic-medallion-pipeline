<rect x="860" y="272" width="356" height="96" rx="10" fill="#FFF6D6" stroke="#C9A227" stroke-width="1.6"/>
<text x="1038.0" y="294" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B5200" text-anchor="middle">Reference data (ref.*)</text>
<text x="1038.0" y="314" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">category &amp; template maps · DQ checks</text>
<text x="1038.0" y="331" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">ontology · gold_sandbox views</text>
<text x="1038.0" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">source + approver recorded</text>
<path d="M 860 320 L 764 320" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="812" y="312" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">every run</text>
<rect x="484" y="280" width="280" height="80" rx="10" fill="#EEF1F5" stroke="#7C8796" stroke-width="1.6"/>
<text x="624.0" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Pipeline (silver · gate · gold)</text>
<text x="624.0" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">known values never re-asked</text>
<rect x="24" y="400" width="1192" height="180" rx="14" fill="#E7F0FF" fill-opacity="0.45" stroke="#3B6FD8" stroke-dasharray="6 4"/>
<text x="38" y="422" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="start">MEMORY (FEEDS THE NEXT PROPOSAL)</text>
<rect x="48" y="432" width="360" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
<text x="228.0" y="454" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Semantic memory</text>
<text x="228.0" y="474" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">what the system knows:</text>
<text x="228.0" y="491" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">approved maps, taxonomy, ontology</text>
<text x="228.0" y="508" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">→ skip the LLM for known values</text>
